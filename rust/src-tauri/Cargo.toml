[package]
name = "rust"
version = "2.0.0-rc.1"
description = "Ren'Py Translation Studio"
license = "CECILL-2.1"
authors = ["lambda-vn"]
edition = "2021"
default-run = "renpy-translation-studio"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rust_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
keyring = "4.2.0"
dirs = "7.0.0"
thiserror = "2.0.20"
regex = "1.13.1"
walkdir = "2.5.0"
crc32fast = "1.5.2"
reqwest = { version = "0.13.5", features = ["json"] }
async-trait = "0.1.92"
tokio = { version = "1.53.1", features = ["sync", "rt", "rt-multi-thread", "macros", "io-std"] }
rmcp = { version = "3.3.0", features = ["server", "macros", "transport-io", "schemars"] }
dunce = "1.0.5"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
flate2 = "1.1.10"
csv = "1.4.0"
quick-xml = "0.42.0"
getrandom = "0.3"

[[bin]]
name = "renpy-translation-studio"
path = "src/main.rs"

[[bin]]
name = "rts-mcp"
path = "src/bin/rts_mcp.rs"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
