<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      text: 'RÉSUMÉ\nKerhaven, petit port de pêche breton imaginaire, années 1920. Le joueur revient au village après la disparition de son père, gardien du phare. Avec Mira et Elias, il enquête sur les lanternes qui s’éteignent une à une chaque nuit de brouillard.\n\nTON\nMélancolique, retenu, quelques touches d’humour sec. Narration au passé simple. Dialogues courts, oraux sans être vulgaires.\n\nLEXIQUE\nthe Lamps -> les Lanternes (toujours avec majuscule)\nthe Keeper -> le Gardien\nfog-night -> nuit de brume\nthe Drowned Bell -> la Cloche noyée\n\nÀ NE PAS TRADUIRE\nKerhaven, Penmarc’h, the Saint-Yves (nom du bateau)'
    };
  }
}
