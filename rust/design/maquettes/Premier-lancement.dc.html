<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Premier lancement</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&amp;display=swap">
<style>
body{margin:0}
.rts{--bg:#F3F3F0;--panel:#FFFFFF;--sunken:#EAEAE5;--hover:#F8F8F5;--line:#E0E0D9;--line2:#C9C9C0;--ink:#1A1B1E;--ink2:#43464C;--ink3:#62656C;--acc:#2B55C6;--accInk:#FFFFFF;--accWeak:#E9EEFB;font-family:'Archivo',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:13px;line-height:1.4}
.rts *{box-sizing:border-box}
.rts button,.rts input{font:inherit;color:inherit}
.rts :focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.rts .mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.rts .btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border:1px solid var(--line2);background:var(--panel);border-radius:6px;cursor:pointer;white-space:nowrap;font-size:13px;color:var(--ink)}
.rts .btn.primary{background:var(--acc);border-color:var(--acc);color:var(--accInk);font-weight:500}
.rts .opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line2);border-radius:8px;cursor:pointer;background:var(--panel)}
.rts .opt:has(input:checked){border-color:var(--acc);box-shadow:0 0 0 1px var(--acc);background:var(--accWeak)}
.rts .opt input{accent-color:var(--acc);width:16px;height:16px;margin:0}
.rts .inp{height:32px;border:1px solid var(--line2);border-radius:6px;padding:0 10px;background:var(--panel);font-size:12.5px;width:100%;min-width:0}
.rts .kbd{font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:16px;padding:0 5px;border:1px solid currentColor;border-bottom-width:2px;border-radius:4px;opacity:.8}
/* RenZip v2 : violet, Archivo, rayons 6/9/14 */
.rts{--bg:#EBE8F2;--panel:#FAF9FB;--sunken:#ECE9F2;--hover:#F7F5FB;--line:#E3E0EA;--line2:#CFCBD8;--ink:#1E1B26;--ink2:#46424F;--ink3:#625E6B;--acc:#7F56E0;--accInk:#FFFFFF;--accWeak:#F3EEFF}
.rts svg rect[rx="5"]{fill:var(--acc)}
.rts .btn,.rts .inp,.rts .opt{border-radius:9px}
.rts .btn.primary{font-weight:600;box-shadow:0 1px 2px rgba(76,47,143,.28)}
.rts .rts-card,.rts > div{border-radius:14px!important}
.rts > div{box-shadow:0 24px 60px rgba(45,32,90,.16),0 4px 12px rgba(30,27,38,.06)}
.rts h1{font-family:'Archivo',system-ui,sans-serif!important;font-weight:800;letter-spacing:-.015em}
</style>
</helmet>
<div class="rts" style="width: 1024px; height: 768px; display: flex; align-items: center; justify-content: center">
<div style="width: 480px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 32px 32px 28px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 14px">
<svg width="32" height="32" viewBox="0 0 20 20" aria-hidden="true"><rect x="1" y="1" width="18" height="18" rx="5" fill="var(--ink)"></rect><path d="M5.5 7.5h9M5.5 11.5h5.5" stroke="var(--panel)" stroke-width="1.7" stroke-linecap="round"></path></svg>
<div>
<h1 style="margin: 0 0 6px; font-size: 22px; font-weight: 600; font-family: 'Literata', Georgia, serif">Ren'Py Translation Studio</h1>
<p style="margin: 0; color: var(--ink2); font-size: 13.5px; line-height: 1.5">Deux réglages avant de commencer. Tout reste modifiable dans les paramètres.</p>
</div>
</div>

<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="font-size: 13px; font-weight: 600; margin-bottom: 8px; padding: 0">Langue de l’interface · Interface language</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<label class="opt"><input type="radio" name="ui-lang" defaultChecked="{{ true }}"><span style="display: flex; flex-direction: column"><span style="font-weight: 500">Français</span><span class="mono" style="font-size: 11.5px; color: var(--ink3)">fr</span></span></label>
<label class="opt"><input type="radio" name="ui-lang"><span style="display: flex; flex-direction: column"><span style="font-weight: 500">English</span><span class="mono" style="font-size: 11.5px; color: var(--ink3)">en</span></span></label>
</div>
</fieldset>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="fl-sdk" style="font-size: 13px; font-weight: 600">SDK Ren'Py <span style="font-weight: 400; color: var(--ink3)">· facultatif</span></label>
<div style="display: flex; gap: 6px"><input id="fl-sdk" class="inp mono" placeholder="Aucun"><button class="btn" style="height: 32px">Parcourir…</button></div>
<p style="margin: 0; font-size: 12px; color: var(--ink3); line-height: 1.5">La plupart des jeux embarquent leur propre moteur. Le SDK ne sert qu’en secours, quand celui du jeu est inutilisable.</p>
</div>

<div style="display: flex; justify-content: flex-end; gap: 8px">
<button class="btn primary">Commencer<span class="kbd">Entrée</span></button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":768}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
