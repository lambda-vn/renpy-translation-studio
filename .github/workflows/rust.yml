name: Rust

# The 2.x rewrite on the `rust` branch, under rust/. CI covers the Python
# code on main and Build packages it with flet; neither looks at this
# directory, so this workflow does both jobs for it: check on every push,
# and package on the three systems.
#
# Tauri does not cross-compile any more than flet did. Each system builds
# its own installer, hence one runner per system.
on:
  workflow_dispatch:
  push:
    branches: [rust]
    tags: ["v2.*"]
  pull_request:
    branches: [rust]
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: rust

jobs:
  # The installer is stamped with the version of tauri.conf.json, the
  # binary with Cargo.toml's and the npm package with its own. A tag that
  # disagrees with any of the three would publish v2.0.0 holding an
  # application that calls itself 2.0.0-rc.1.
  version:
    if: startsWith(github.ref, 'refs/tags/v2.')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - shell: bash
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          status=0
          check() {
            if [ "$2" != "$tagged" ]; then
              echo "Tag $GITHUB_REF_NAME asks for $tagged, $1 declares $2." >&2
              status=1
            fi
          }
          check Cargo.toml "$(python3 -c 'import tomllib; print(tomllib.load(open("src-tauri/Cargo.toml", "rb"))["package"]["version"])')"
          check tauri.conf.json "$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          check package.json "$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          if [ "$status" -ne 0 ]; then
            echo "Bump the version, commit, then move the tag." >&2
          fi
          exit "$status"

  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            runner: ubuntu-latest
          - target: windows
            runner: windows-latest
          - target: macos
            runner: macos-latest

    steps:
      - uses: actions/checkout@v7

      # The Tauri prerequisites for Linux, plus libdbus for the keyring
      # crate's Secret Service backend, which was not checked against the
      # crate's actual features and costs nothing to have.
      - name: Install the Linux build dependencies
        if: matrix.target == 'linux'
        working-directory: .
        run: |
          sudo apt-get update --allow-releaseinfo-change
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libdbus-1-dev pkg-config patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/src-tauri

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rust/package-lock.json

      - run: npm ci

      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      # No -D warnings. The extraction pipeline is not ported yet, so its
      # parser and a few helpers are compiled and never called, and clippy
      # reports every one as dead code. Denying warnings would fail on
      # code that is meant to be there; this still fails on an error.
      - run: cargo clippy --all-targets --manifest-path src-tauri/Cargo.toml

      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - run: npm run check

      - name: Build the installer
        env:
          # linuxdeploy bundles an old `strip` that chokes on the
          # sections newer toolchains emit, which fails the AppImage.
          NO_STRIP: "true"
        run: npm run bundle

      # Starting the process would prove nothing. This holds a real
      # conversation with the sidecar that was just staged, the file the
      # installer carries: initialize, list the tools, call one, and fail
      # when the reply is not one or the set of tools is not the expected
      # one.
      - name: Smoke-test the packaged MCP server
        shell: bash
        run: |
          python="$(command -v python3 || command -v python)"
          sidecar="$(echo src-tauri/binaries/rts-mcp-*)"
          echo "sidecar: $sidecar"
          test -f "$sidecar"
          "$python" scripts/mcp_handshake.py "$sidecar"

      # upload-artifact drops the Unix permission bits, so the AppImage
      # has to be made executable again after the download.
      - uses: actions/upload-artifact@v7
        if: matrix.target == 'windows'
        with:
          name: windows
          path: rust/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: matrix.target == 'macos'
        with:
          name: macos
          path: rust/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: matrix.target == 'linux'
        with:
          name: linux
          path: |
            rust/src-tauri/target/release/bundle/deb/*.deb
            rust/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
