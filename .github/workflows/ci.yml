name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Reading the code is all any of these jobs does. Stated rather than
# inherited, so a token that grows by default does not grow here.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv run ruff check
      - run: uv run ruff format --check

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv run mypy src/

  tests:
    # Three systems because the code branches on the platform: revealing a
    # file in the file manager goes through Explorer, Finder or D-Bus, and a
    # Linux-only run let a broken Windows path through once already.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv run pytest
