name: Build

# Each desktop target is built on its own system: flet build does not
# cross-compile, it drives the Flutter toolchain of the machine it runs
# on. Three runners is therefore the only way to produce three binaries.
#
# Never on push: a build pulls the Flutter SDK and takes minutes, where
# the CI workflow answers in seconds and is what every commit needs.
# Start it by hand, or tag a version.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Reading the code and uploading an artifact is all this does. Stated
# rather than inherited, so a token that grows by default does not grow
# here. The release job raises its own, for itself alone.
permissions:
  contents: read

env:
  UV_PYTHON: "3.12"
  PYTHONUTF8: 1
  FLET_CLI_NO_RICH_OUTPUT: 1

jobs:
  # flet stamps the binary with project.version, never with the tag, so a
  # tag disagreeing with pyproject would publish v0.2.0 containing an
  # application that calls itself 0.1.0. Ten seconds here, run beside the
  # builds rather than after them, and the release cannot happen without
  # it.
  version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          declared="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tagged" ]; then
            echo "Tag $GITHUB_REF_NAME asks for $tagged, pyproject declares $declared." >&2
            echo "Bump the version, commit, then move the tag." >&2
            exit 1
          fi

  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            runner: ubuntu-latest
          - target: windows
            runner: windows-latest
          # arm64 only. serious_python packages one slice per architecture,
          # and the x86_64 one has to build cryptography from source on an
          # Apple Silicon runner: a Rust extension cross-compiled by a
          # toolchain whose own cffi is x86_64 while the interpreter running
          # it is arm64. Nothing in this repository can fix that, and Intel
          # Macs have not been sold since 2023.
          - target: macos
            runner: macos-latest
            args: --arch arm64

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # The list comes from flet itself rather than being copied here, so
      # it cannot drift from the version the project actually pins.
      #
      # The warm-up call is not redundant. Since 0.86 flet installs
      # flet-cli on first use and says so on stdout, ahead of anything
      # the command was asked for, which is a parse error for whatever
      # reads it. Spending that first call on nothing leaves the second
      # one clean.
      - name: Install the Linux build dependencies
        if: matrix.target == 'linux'
        shell: bash
        run: |
          sudo apt-get update --allow-releaseinfo-change
          uv run flet --version > /dev/null
          deps="$(uv run flet --version --json | jq -r '.linux_dependencies | join(" ")')"
          sudo apt-get install -y --no-install-recommends $deps
          sudo apt-get clean

      # Flutter builds plugins through symlinks, which Windows only grants
      # under Developer Mode. Whether a runner already has it on was never
      # verified, and the check costs nothing on a throwaway machine where
      # a build failing on it costs ten minutes.
      - name: Allow symlinks
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name AllowDevelopmentWithoutDevLicense `
            -Value 1 -PropertyType DWord -Force | Out-Null

      - name: Build
        shell: bash
        run: uv run flet build ${{ matrix.target }} ${{ matrix.args }} --yes --verbose

      # `flet build` reads project.dependencies from pyproject and installs
      # from those specifiers; uv.lock is never consulted. The direct ones
      # are pinned there so they cannot move, but pip still resolves the
      # transitive tree freshly on every build, and a dozen of those
      # packages differed from the lock the day this was written.
      #
      # Nothing here can prevent that, so this records it instead: the
      # archive carries the list of what is inside it, and comparing two
      # releases becomes a subtraction rather than an excavation. A gate
      # was considered and dropped, since the only remedy when it fired
      # would be to re-lock until the build agreed, which lets the build
      # dictate the lock rather than the reverse.
      #
      # Read from the built tree rather than from any manifest, and
      # recursively, since where site-packages lands differs per platform.
      # A distribution directory is `<name>-<version>.dist-info`, and a
      # name may hold hyphens and dots of its own, so the split is on the
      # last hyphen that introduces a digit.
      - name: Record what the archive contains
        shell: bash
        run: |
          version="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          out="build/${{ matrix.target }}/packaged-dependencies.txt"
          echo "# renpy-translation-studio $version ${{ matrix.target }}" > "$out"
          find "build/${{ matrix.target }}" -type d -name '*.dist-info' \
            | sed 's|.*[/\\]||; s|\.dist-info$||; s|-\([0-9][^-]*\)$|==\1|' \
            | sort >> "$out"
          cat "$out"

      # Nobody has ever launched the Linux binary. v0.1.0 shipped it
      # unverified and said so, and the class of bug that hides there is
      # the one that already happened: under flet 0.85.3 the Windows
      # build opened its window and never called main(), so the process
      # was alive, the window was titled, and nothing had run.
      #
      # A liveness check would therefore have been green through that
      # bug, and so would a window title, which the native side sets
      # before Python speaks. What separates a working application from
      # a shell is the pixels, so this photographs the screen and reports
      # how much it varies: a window that never rendered is one flat
      # colour.
      #
      # The threshold is read off a real run rather than invented: the
      # onboarding screen measured 26482 of a 65535 quantum, where an
      # unpainted window is one flat colour and lands near zero. 5000 sits
      # far above blank and far below what rendering produces.
      - name: Smoke-test the Linux binary
        if: matrix.target == 'linux'
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends xvfb imagemagick
          binary="$(find build/linux -maxdepth 3 -type f -executable \
            -name 'renpy*' | head -1)"
          echo "binary: ${binary:-NONE FOUND}"
          test -n "$binary"

          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 3

          "$binary" &
          app=$!
          sleep 30

          if ! kill -0 "$app" 2>/dev/null; then
            echo "the application exited on its own"
            exit 1
          fi
          import -window root smoke-linux.png
          deviation="$(identify -format '%[standard-deviation]' smoke-linux.png)"
          echo "standard deviation: $deviation"
          kill "$app" 2>/dev/null || true
          awk -v d="$deviation" 'BEGIN {
            if (d < 5000) {
              print "the window never rendered anything"
              exit 1
            }
            print "the application drew its interface"
          }'

      # macOS has never been launched either, and whether its runner even
      # has a display server to draw into is exactly what nobody knows.
      # So this asks rather than asserts: it is allowed to fail, and what
      # it reports decides whether there is a gate to build here at all.
      - name: Probe whether the macOS binary can be launched
        if: matrix.target == 'macos'
        continue-on-error: true
        shell: bash
        run: |
          bundle="$(find build/macos -maxdepth 2 -name '*.app' | head -1)"
          echo "bundle: ${bundle:-NONE FOUND}"
          test -n "$bundle"
          binary="$(find "$bundle/Contents/MacOS" -type f -perm +111 | head -1)"
          echo "binary: ${binary:-NONE FOUND}"

          "$binary" &
          app=$!
          sleep 30

          if ! kill -0 "$app" 2>/dev/null; then
            echo "the application exited on its own"
            exit 1
          fi
          echo "the process is still alive"
          screencapture -x smoke-macos.png && echo "screen captured" \
            || echo "screencapture refused, no session to photograph"
          kill "$app" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: matrix.target == 'linux'
        with:
          name: smoke-linux
          path: smoke-linux.png

      - uses: actions/upload-artifact@v4
        if: matrix.target == 'macos'
        continue-on-error: true
        with:
          name: smoke-macos
          path: smoke-macos.png
          if-no-files-found: warn

      # upload-artifact drops the Unix permission bits, so a macOS bundle or
      # a Linux binary that made the round trip through it is no longer
      # executable. The archive is therefore written here, on the machine
      # that produced the files, and it is the archive that travels.
      #
      # The name comes from pyproject rather than from the tag: it is the
      # version flet just wrote into the binary, and it is the one that
      # still makes sense for a build started by hand, off any tag.
      #
      # The build directory is renamed and archived as itself rather than
      # from the inside, so that the zip holds one folder instead of six
      # thousand loose files. Unpacked into a downloads folder, the flat
      # form scatters all of them next to whatever was already there.
      #
      # That folder is named for the application alone, where the file is
      # named for the version and the platform too. Every character of it
      # is spent twice on Windows, which refuses a path over 260: the
      # longest path inside the archive is already 155, a generated
      # mistralai model, and what remains is the room a user has to
      # unpack into. The short folder leaves 78 characters rather than
      # 64, and the failure it buys back is a ModuleNotFoundError naming
      # some unrelated dependency, which says nothing about path length.
      - name: Package
        shell: bash
        run: |
          version="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          name="renpy-translation-studio-$version-${{ matrix.target }}"
          folder="renpy-translation-studio"
          mkdir dist
          mv "build/${{ matrix.target }}" "build/$folder"
          cd build
          if [ "${{ matrix.target }}" = windows ]; then
            7z a -tzip "../dist/$name.zip" "$folder"
          else
            zip -r -y "../dist/$name.zip" "$folder"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error

  # A draft, never a published release: the binaries are unsigned, which
  # SmartScreen and Gatekeeper both have something to say about, and that
  # belongs in the notes a human writes before pressing publish.
  release:
    needs: [version, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    # The only job here allowed to write to the repository, and only
    # because creating a release is writing to it.
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # gh over an action from the Marketplace: one less third party in a
      # job holding a write token.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*.zip
          --repo "$GITHUB_REPOSITORY"
          --draft
          --generate-notes
